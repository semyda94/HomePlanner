<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home Planner</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #2b2f36; --muted: #7a808a;
    --line: #e3e0da; --accent: #d9632b; --accent-soft: #fbe9df; --wall: #3a3f48;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.4 system-ui, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg);
         display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: var(--panel);
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: -.01em; margin-right: 6px; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .group { display: flex; gap: 2px; background: var(--bg); padding: 3px; border-radius: 9px; }
  button { font: inherit; color: inherit; border: 0; background: transparent; padding: 6px 11px;
           border-radius: 7px; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(0,0,0,.06); }
  button.on { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.15); color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .35; cursor: default; background: transparent; }
  kbd { font: 11px ui-monospace, monospace; color: var(--muted); margin-left: 4px; }
  label.num { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  input[type=number] { width: 64px; font: inherit; padding: 5px 6px; border: 1px solid var(--line);
                       border-radius: 6px; background: #fff; color: var(--ink); }
  .spacer { flex: 1; }
  main { flex: 1; display: flex; min-height: 0; }
  .pane { position: relative; flex: 1; min-width: 0; min-height: 0; }
  #pane3d { border-left: 1px solid var(--line); background: #dfe7ee; }
  body.only2d #pane3d, body.only3d #pane2d { display: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .tag { position: absolute; top: 10px; right: 12px; font-size: 11px; font-weight: 600; letter-spacing: .08em;
         color: var(--muted); text-transform: uppercase; pointer-events: none; }
  .hint { position: absolute; left: 12px; bottom: 10px; right: 12px; display: flex; justify-content: space-between;
          gap: 12px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .hint b { color: var(--ink); font-weight: 600; }
  /* side panels: #props (left of the 2D plan) for the object selected there, #props3d (right of the 3D model) for the wall picked there */
  .sidep { flex: 0 0 min(290px, 30%); min-width: 0; min-height: 0; box-sizing: border-box; background: var(--panel);
           padding: 14px 14px 20px; display: none; overflow: auto; }
  #props { border-right: 1px solid var(--line); }
  #props3d { border-left: 1px solid var(--line); }
  body.only3d #props, body.only2d #props3d { display: none !important; }
  .sidep h4 { margin: 0 0 8px; font-size: 13px; }
  .sidep .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 5px 0;
                color: var(--muted); font-size: 13px; }
  .sidep button.del { margin-top: 6px; width: 100%; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .sidep .plist { max-height: none; }
  .sidep label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .sidep input[type=text] { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); }
  .sidep .sub { margin: 10px 0 5px; font-size: 12px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .chips button { padding: 3px 8px; font-size: 12px; background: var(--bg); border-radius: 99px; }
  .chips button.on { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
  .swatches { display: flex; flex-wrap: wrap; gap: 5px; }
  .swatches button, .swatches .custom { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); cursor: pointer; }
  .swatches button.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--accent); }
  .swatches .custom { position: relative; display: grid; place-items: center; color: var(--muted); background: #fff; overflow: hidden; }
  .swatches .custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .swatches .none { font-size: 12px; color: var(--muted); line-height: 24px; }
  .chips button.warn { color: #b3261e; }
  .plist { list-style: none; margin: 6px 0; padding: 0; max-height: 170px; overflow: auto; }
  .plist li { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 13px; }
  .plist .t { flex: 1; overflow-wrap: anywhere; }
  .plist li.done .t { text-decoration: line-through; color: var(--muted); }
  .plist .price, .plist .empty { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .plist button.x { padding: 0 6px; background: none; color: var(--muted); box-shadow: none; }
  .addrow { display: flex; gap: 4px; }
  .addrow input { min-width: 0; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); }
  .addrow input[type=text] { flex: 1; }
  .addrow input[type=number] { width: 70px; }
  .addrow button { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  #lists { position: fixed; top: 58px; right: 12px; width: 320px; max-width: calc(100vw - 24px); max-height: calc(100vh - 80px);
           overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
           box-shadow: 0 6px 22px rgba(0,0,0,.14); display: none; z-index: 5; }
  #lists h4 { margin: 4px 0 6px; font-size: 13px; }
  #lists .plist { max-height: none; margin: 2px 0 10px; }
  #lists button.room { padding: 2px 0; background: none; box-shadow: none; font-size: 12px; font-weight: 600; color: var(--accent); }
  #lists .empty { color: var(--muted); font-size: 13px; }
  @media (max-width: 800px) { main { flex-direction: column; } .sidep { flex-basis: min(290px, 40%); } #props { border-right: 0; border-bottom: 1px solid var(--line); } #props3d { border-left: 0; border-top: 1px solid var(--line); } #pane3d { border-left: 0; border-top: 1px solid var(--line); } kbd { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body class="split">
<header>
  <div class="brand">Home<span>Planner</span></div>
  <div class="group" id="floors"></div>
  <div class="group" id="tools">
    <button data-tool="select">Select<kbd>V</kbd></button>
    <button data-tool="wall">Wall<kbd>W</kbd></button>
    <button data-tool="door">Door<kbd>D</kbd></button>
    <button data-tool="window">Window<kbd>N</kbd></button>
    <button data-tool="stairs">Stairs</button>
  </div>
  <div class="group" title="Outdoor areas: click each corner, click the first corner again to close">
    <button data-tool="backyard">Backyard</button>
    <button data-tool="deck">Deck</button>
    <button data-tool="balcony">Balcony</button>
  </div>
  <div class="group">
    <button id="undo" title="Ctrl+Z">Undo</button>
    <button id="redo" title="Ctrl+Y">Redo</button>
  </div>
  <label class="num">Wall height <input id="height" type="number" min="2" max="5" step="0.1"> m</label>
  <label class="num">Thickness <input id="thickness" type="number" min="0.05" max="0.6" step="0.01"> m</label>
  <div class="spacer"></div>
  <div class="group"><button id="listsBtn" title="To-do and shopping lists for the whole house">Lists</button></div>
  <div class="group" id="views">
    <button data-view="only2d">2D</button>
    <button data-view="split">Split</button>
    <button data-view="only3d">3D</button>
  </div>
  <div class="group">
    <button id="export">Export</button>
    <button id="import">Import</button>
    <button id="clear">Clear</button>
  </div>
  <input id="file" type="file" accept=".json,application/json" hidden>
</header>
<div id="lists"></div>
<main>
  <aside id="props" class="sidep"></aside>
  <div class="pane" id="pane2d">
    <canvas id="plan"></canvas>
    <div class="tag">Floor plan</div>
    <div class="hint"><span id="hint"></span><span id="total"></span></div>
  </div>
  <div class="pane" id="pane3d">
    <canvas id="view3d"></canvas>
    <div class="tag">3D model</div>
    <div class="hint"><span>Drag to orbit · right-drag to pan · scroll to zoom</span>
      <span style="pointer-events:auto"><button id="allFloors" style="background:#fff" title="Switch between all floors and only up to the floor being edited">Showing up to this floor</button> <button id="fit" style="background:#fff">Reset view</button></span></div>
  </div>
  <aside id="props3d" class="sidep"></aside>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------- model */
const STORE = 'home-planner-v2', GRID = 0.1;
let seq = 1;
const nid = () => 'i' + Date.now().toString(36) + (seq++);
const r2 = v => Math.round(v * 100) / 100;
const key = p => Math.round(p.x * 100) + ',' + Math.round(p.y * 100);
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wlen = w => dist(w.a, w.b);

function newOpening(type, wallId, pos) {
  return type === 'door'
    ? { id: nid(), type, wallId, pos, width: 0.9, height: 2.1, sill: 0 }
    : { id: nid(), type, wallId, pos, width: 1.2, height: 1.3, sill: 0.9 };
}
// Stairs: x,y = start corner, rot = heading in degrees, turn = angle between the two flights (sign = side).
const STAIR_DEFAULT = { type: 'straight', rot: 0, width: 1, run: 3.2, run2: 1, turn: 90, winders: false, radius: 0.9, sweep: 300 };
const mkStair = s => ({ id: nid(), ...STAIR_DEFAULT, ...s });
// Townhouse stairwell (x 3–4 m): a straight flight up from the entry hall, and above it
// a flight that ends in a winder turn onto the floor-3 landing.
const TOWNHOUSE_STAIRS = [
  [{ type: 'straight', x: 3, y: 10.3, rot: -90, run: 3.3 }],
  [{ type: 'turn', x: 3, y: 10.1, rot: -90, run: 2.2, run2: 0, turn: -90, winders: true }],
];
// The three-floor townhouse, traced from the owner's plan. Coordinates are wall
// centerlines in meters (x across the 4.1 m width, y from the patio end to the street end).
function townhouse() {
  const floor = (name, walls, ops, rooms, areas = []) => {
    const w = walls.map(([x1, y1, x2, y2]) => ({ id: nid(), a: { x: x1, y: y1 }, b: { x: x2, y: y2 } }));
    return { name, height: 2.7, thickness: 0.2, walls: w,
      openings: ops.map(([type, i, pos, width]) => { const o = newOpening(type, w[i].id, pos); if (width) o.width = width; return o; }),
      rooms: rooms.map(([x, y, name, color]) => ({ id: nid(), x, y, name, color })),
      areas: areas.map(a => ({ id: nid(), name: '', railH: 1, ...a, pts: a.pts.map(([x, y]) => ({ x, y })) })) };
  };
  const BED = '#d6e2f4', WET = '#cfe8ea', STAIR = '#e3dcf2', GREY = '#b3b8bf';
  return { active: 0, floors: [
    floor('Floor 1',
      [[0,0,4.1,0], [0,0,0,13.2], [4.1,0,4.1,12.4], [0,13.2,2.9,13.2], [2.9,6.9,2.9,13.2], [2.9,12.4,4.1,12.4],
       [2.9,6.9,4.1,6.9], [0,2.7,4.1,2.7], [0,5.8,4.1,5.8], [3,2.7,3,5.8]],
      [['door',0,2.05,1.5], ['door',7,2.4], ['door',8,2.4], ['door',9,1.5,0.8], ['door',4,0.6], ['door',4,4],
       ['door',5,0.6], ['door',3,1.45,2.5]],
      [[2,1.3,'Bedroom',BED], [1.5,4.2,'Flexi room','#d3e9db'], [3.5,4.2,'WC',WET], [1.4,9.5,'Garage','#dcdcdc'], [3.5,9.5,'Entry & stairs',STAIR]],
      [{ type: 'backyard', name: 'Patio', color: GREY, elev: 0, rail: true, railH: 1.8, pts: [[0,-5.7],[4.1,-5.7],[4.1,0],[0,0]] },
       { type: 'deck', name: 'Porch', color: GREY, elev: 0.05, rail: false, pts: [[2.9,12.4],[4.1,12.4],[4.1,13.2],[2.9,13.2]] }]),
    floor('Floor 2',
      [[0,2.7,4.1,2.7], [0,2.7,0,13.2], [4.1,2.7,4.1,13.2], [0,13.2,4.1,13.2], [2.9,6.9,2.9,8.5], [2.9,11.3,4.1,11.3]],
      [['door',0,2.05,1.5], ['window',3,1.75,1.5]],
      [[1.5,8,'Living · Dining · Kitchen','#fbe3c2']],
      [{ type: 'balcony', color: GREY, elev: 0, rail: true, pts: [[0,0.1],[4.1,0.1],[4.1,2.7],[0,2.7]] }]),
    floor('Floor 3',
      // 4 = master/landing wall, 5–7 = bath wall with its jog, 8–10 = bedroom wall and stair nook, 11–14 = built-in wardrobes
      [[0,2.7,4.1,2.7], [0,2.7,0,13.2], [4.1,2.7,4.1,13.2], [0,13.2,4.1,13.2], [0,6.8,4.1,6.8],
       [2,6.8,2,7.8], [1.7,7.8,2,7.8], [1.7,7.8,1.7,9.7],
       [0,9.7,2.9,9.7], [2.9,9.7,2.9,10.2], [2.9,10.2,4.1,10.2],
       [3.3,4.5,4.1,4.5], [3.3,4.5,3.3,6.8], [3.3,10.2,3.3,11.9], [3.3,11.9,4.1,11.9]],
      [['window',0,1.95,1.75], ['window',3,2,1.35], ['door',4,2.5,0.85], ['door',4,1.2,0.8], ['door',5,0.5,0.7], ['door',8,2.4,0.8],
       ['door',12,1.15,1.9], ['door',13,0.85,1.4]],
      [[1.6,4.7,'Master bedroom',BED], [1,8.2,'Bath',WET], [3.2,8.2,'Landing & stairs',STAIR], [1.5,11.5,'Bedroom',BED],
       [3.7,5.6,'Wardrobe','#d8ccb8'], [3.7,11,'Wardrobe','#d8ccb8']]),
  ] };
}
// A plan is { active, floors: [...] }; each floor carries its own walls, openings, areas, room tags, height and thickness.
function migrate(s) {
  const p = s && Array.isArray(s.walls) ? { active: 0, floors: [{ name: 'Floor 1', ...s }] } : s;
  if (p && Array.isArray(p.floors) && !p.v) {
    // one-off: a townhouse saved before stairs existed gets its reference stairs
    if (p.floors.length === 3 && p.floors[0].walls?.length === 10 && !p.floors.some(f => f.stairs?.length))
      TOWNHOUSE_STAIRS.forEach((list, i) => p.floors[i].stairs = list.map(mkStair));
    p.v = 2;
  }
  if (p && p.v === 2) {
    // one-off: the townhouse gets its real exterior (garage door, clad balcony wall)
    if (p.floors.length === 3 && p.floors[0].walls?.length === 10) {
      for (const o of p.floors[0].openings) if (o.type === 'door' && o.width >= 2.4 && !o.style) o.style = 'garage';
      for (const f of p.floors) for (const a of f.areas || []) if (a.type === 'balcony' && !a.railStyle) { a.railStyle = 'solid'; a.railH = 1.5; }
    }
    p.v = 3;
  }
  if (p && p.v === 3) {
    // one-off: floor 3 of an untouched townhouse is re-traced from the plan (ensuite door, bath jog, wardrobes, window sizes)
    const f = p.floors[2];
    if (p.floors.length === 3 && p.floors[0].walls?.length === 10 && f.walls.length === 9 && f.openings.length === 5) {
      const fresh = townhouse().floors[2];
      f.walls = fresh.walls; f.openings = fresh.openings;
      (f.rooms ||= []).push(...fresh.rooms.filter(r => r.name === 'Wardrobe'));
    }
    p.v = 4;
  }
  return p;
}
function valid(p) {
  return p && Array.isArray(p.floors) && p.floors.length > 0
    && p.floors.every(f => f && Array.isArray(f.walls) && Array.isArray(f.openings) && f.height > 0 && f.thickness > 0);
}
function load() { try { const p = migrate(JSON.parse(localStorage.getItem(STORE))); return valid(p) ? p : null; } catch { return null; } }
function save() { try { localStorage.setItem(STORE, JSON.stringify(P)); } catch {} }

let P, S;                                          // P = whole plan, S = the floor being edited
function setP(p) { P = p; P.active = clamp(P.active | 0, 0, P.floors.length - 1); S = P.floors[P.active]; }
setP(load() || migrate(townhouse()));
let rooms = [], allRooms = [];                     // rooms of the active floor / of every floor
const undoStack = [], redoStack = [];
const wallById = id => S.walls.find(w => w.id === id);

/* Colour picker shared by every panel: preset swatches and a custom colour, then the colours the user saved (kept in the plan). */
function colorPicker(presets, color) {
  color = (color || '').toLowerCase();
  const saved = P.saved || [], sw = c => `<button data-color="${c}" title="${c}" style="background:${c}" class="${c === color ? 'on' : ''}"></button>`;
  return `<div class="swatches">${presets.map(sw).join('')}
      <label class="custom" title="Custom color"><input type="color" value="${color}">+</label></div>
    <div class="sub">Saved colors</div>
    <div class="swatches">${saved.map(sw).join('') || '<span class="none">None yet — pick a color, then save it</span>'}</div>
    <div class="chips">${saved.includes(color)
      ? `<button class="warn" data-unsave="${color}">Delete this saved color</button>`
      : `<button data-save="${color}">+ Save this color</button>`}</div>`;
}
function bindSaved(el) {                             // the save / delete buttons; swatch clicks are bound by each panel
  const set = list => { commit(); if (list.length) P.saved = list; else delete P.saved; save(); showProps(); };
  el.querySelectorAll('[data-save]').forEach(b => b.onclick = () => set([...(P.saved || []), b.dataset.save].slice(-24)));
  el.querySelectorAll('[data-unsave]').forEach(b => b.onclick = () => set((P.saved || []).filter(c => c !== b.dataset.unsave)));
}
function commit() { undoStack.push(JSON.stringify(P)); if (undoStack.length > 100) undoStack.shift(); redoStack.length = 0; }
function restore(from, to) {
  if (!from.length) return;
  to.push(JSON.stringify(P)); setP(JSON.parse(from.pop())); sel = null; chain = null; drag = null; poly = null;
  changed(); showProps(); syncInputs();
}

function clampOpening(o) {
  const w = wallById(o.wallId); if (!w) return false;
  const L = wlen(w); if (L < 0.4) return false;
  o.width = r2(clamp(o.width, 0.3, L - 0.1));
  o.pos = r2(clamp(o.pos, o.width / 2 + 0.05, L - o.width / 2 - 0.05));
  o.sill = r2(clamp(o.sill, 0, S.height - 0.3));
  o.height = r2(clamp(o.height, 0.3, S.height - o.sill));
  return true;
}
// Outdoor areas are free polygons drawn by the user (unlike rooms, which are derived from walls).
const AREA = {
  backyard: { label: 'Backyard', color: '#b7d69b', elev: 0,   rail: false, railH: 1.5, railName: 'Fence' },
  deck:     { label: 'Deck',     color: '#c9a273', elev: 0.1, rail: false, railH: 1.0, railName: 'Railing' },
  balcony:  { label: 'Balcony',  color: '#d3d3d3', elev: 0.1, rail: true,  railH: 1.0, railName: 'Railing' },
};
const areas = () => S.areas || (S.areas = []);
const polyArea = pts => Math.abs(pts.reduce((s, p, i) => { const q = pts[(i + 1) % pts.length]; return s + p.x * q.y - q.x * p.y; }, 0)) / 2;
const stairs = () => S.stairs || (S.stairs = []);
const toWorld = (p, st) => { const r = st.rot * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return { x: st.x + p.x * c - p.y * s, y: st.y + p.x * s + p.y * c }; };
// Returns the stair as a list of step polygons (lowest first) plus a centerline path, in plan coordinates.
function stairGeom(st, rise) {
  const N = Math.max(3, Math.round(rise / 0.18)), w = st.width, steps = [], path = [], pt = (x, y) => ({ x, y });
  const tread = (a, b) => [pt(a, 0), pt(b, 0), pt(b, w), pt(a, w)];
  if (st.type === 'spiral') {
    const R = st.radius, r0 = Math.min(0.12, R / 4), sw = st.sweep * Math.PI / 180, at = (r, t) => pt(r * Math.cos(t), r * Math.sin(t));
    for (let k = 0; k < N; k++) { const a = k * sw / N, b = (k + 1) * sw / N; steps.push([at(r0, a), at(R, a), at(R, (a + b) / 2), at(R, b), at(r0, b)]); }
    for (let i = 0; i <= 32; i++) path.push(at(R * 0.62, sw * i / 32));
  } else if (st.type === 'turn') {
    const th = clamp(Math.abs(st.turn), 15, 180) * Math.PI / 180, run1 = st.run, run2 = st.run2;
    const nT = st.winders ? Math.max(2, Math.round(th / (Math.PI / 6))) : 1;         // winder steps, or one flat landing
    const rest = N - nT, n2 = run2 < 0.1 ? 0 : clamp(Math.round(rest * run2 / (run1 + run2)), 1, rest - 1), n1 = rest - n2;
    for (let k = 0; k < n1; k++) steps.push(tread(k * run1 / n1, (k + 1) * run1 / n1));
    // the turn fans around the inner corner; its outer edge is one or two square corners
    const pv = pt(run1, w), a0 = -Math.PI / 2, m = th > Math.PI / 2 + 1e-6 ? 2 : 1, seg = th / m;
    const edge = phi => {

    const geo = flat ? new THREE.ShapeGeometry(shape) : new THREE.ExtrudeGeometry(shape, { depth: slab, bevelEnabled: false });
    geo.rotateX(Math.PI / 2);                          // top face ends up at y = 0, slab extends downward
    const mesh = new THREE.Mesh(geo, floorMat(a.color));
    mesh.position.y = flat ? 0.004 : a.elev + (level ? 0.01 : 0); mesh.receiveShadow = true; mesh.castShadow = !flat; model.add(mesh);
    if (!level && a.elev > 0.35) for (const p of a.pts) {        // support posts for raised platforms
      if (nearWall(p)) continue;
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, a.elev - slab, 0.1), M.rail);
      post.position.set(p.x, (a.elev - slab) / 2, p.y); post.castShadow = true; model.add(post);
    }
    if (!a.rail) continue;
    const RH = a.railH;
    a.pts.forEach((p, i) => {
      const q = a.pts[(i + 1) % a.pts.length], L = dist(p, q); if (L < 0.05) return;
      const g = new THREE.Group();
      g.position.set(p.x, a.elev, p.y); g.rotation.y = -Math.atan2(q.y - p.y, q.x - p.x); model.add(g);
      // skip the stretches of this edge that run along a house wall
      const n = Math.ceil(L / 0.2); let start = null;
      for (let k = 0; k <= n; k++) {
        const f = (k + 0.5) / n, free = k < n && !nearWall({ x: p.x + (q.x - p.x) * f, y: p.y + (q.y - p.y) * f });
        if (free && start === null) start = k;
        if (free || start === null) continue;
        const s = start / n * L, e = k / n * L; start = null;
        const posts = Math.max(1, Math.ceil((e - s) / (a.type === 'backyard' ? 2 : 1.2)));
        if (a.type === 'backyard') {
          box(g, M.fence, s, e, 0.05, RH, 0.03);
          for (let j = 0; j <= posts; j++) { const x = s + (e - s) * j / posts; box(g, M.fence, x - 0.05, x + 0.05, 0, RH + 0.08, 0.1); }
        } else if (railStyle(a) === 'solid') {          // clad balustrade wall with a white capping
          box(g, M.wall, s, e, -(level ? SLAB : 0), RH, 0.12);
          for (const sign of [1, -1]) skin(g, [{ a: s, b: e, out: true, mat: M.clad }], sign, s, e, -(level ? SLAB : 0), RH, 0.06);
          box(g, M.trim, s - 0.02, e + 0.02, RH, RH + 0.04, 0.2);
        } else {
          box(g, M.rail, s, e, RH - 0.05, RH, 0.07); box(g, M.rail, s, e, 0.08, 0.12, 0.04);
          if (railStyle(a) === 'glass') box(g, M.glass, s, e, 0.12, RH - 0.05, 0.012); else box(g, M.rail, s, e, RH / 2 - 0.02, RH / 2 + 0.02, 0.04);
          for (let j = 0; j <= posts; j++) { const x = s + (e - s) * j / posts; box(g, M.rail, x - 0.025, x + 0.025, 0, RH, 0.05); }
        }
      }
    });
  }
    // stairs climb one full storey: each step is a short prism under its tread
    const rise = H + SLAB;
    for (const st of S.stairs || []) {
      const g = stairGeom(st, rise);
      g.steps.forEach((poly, k) => {
        const h = (k + 1) * rise / g.N, depth = st.type === 'spiral' ? 0.06 : Math.min(h, 0.32);
        const geo = new THREE.ExtrudeGeometry(new THREE.Shape(poly.map(p => new THREE.Vector2(p.x, p.y))), { depth, bevelEnabled: false });
        geo.rotateX(Math.PI / 2);
        const m = new THREE.Mesh(geo, M.stair); m.position.y = h; m.castShadow = m.receiveShadow = true; model.add(m);
      });
      if (st.type === 'spiral') {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, rise + 0.9, 16), M.rail);
        post.position.set(st.x, (rise + 0.9) / 2, st.y); post.castShadow = true; model.add(post);
      }
    }

  })(new THREE.Group());
}
/* Picking a wall face in the 3D view opens its panel on the right. */
const props3 = document.getElementById('props3d'), ray = new THREE.Raycaster();
const WALL_SWATCHES = ['#f3efe8', '#ffffff', '#ece9d2', '#e3ddcf', '#d6cfc0', '#cfd8dc', '#b0bec5', '#c8d6c1', '#a8c0a0',
  '#f0d9b5', '#e6c9a8', '#d9a58c', '#c97b63', '#8fa9c4', '#5b7a99', '#4a4f58', '#2b2f36'];
let down3 = null;
c3.addEventListener('pointerdown', e => { down3 = { x: e.clientX, y: e.clientY }; });
c3.addEventListener('pointerup', e => {                // a click, not the end of an orbit drag
  if (!down3 || e.button !== 0 || Math.hypot(e.clientX - down3.x, e.clientY - down3.y) > 4) return;
  const r = c3.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const up = (o, k) => { while (o && !o.userData[k]) o = o.parent; return o; };
  const hit = ray.intersectObject(model, true).find(h => up(h.object, 'door') || h.object.material !== M.glass);   // look through window glass
  const d = hit && up(hit.object, 'door'), g = hit && up(hit.object, 'wall');
  if (d) { sel3 = { kind: 'door', ...d.userData.door }; if (sel && sel.type === 'opening') { sel = null; showProps(); } }   // one picked door at a time
  else if (g) {
    const p = g.worldToLocal(hit.point.clone()), u = g.userData.wall;
    sel3 = { kind: 'wall', floor: u.floor, id: u.id, side: p.z >= 0 ? 1 : -1, at: r2(clamp(p.x, 0.02, u.len - 0.02)) };
  } else sel3 = null;
  dirty3d = true; showProps3(); draw();
});
function pickedFace() {                                // resolves sel3 against the current plan
  const f = sel3 && sel3.kind === 'wall' && P.floors[sel3.floor], w = f && f.walls.find(x => x.id === sel3.id);
  const rooms = w && (allRooms[sel3.floor] || []);
  const run = w && sideRuns(rooms, w.a, w.b, sel3.side, f.thickness / 2).find(r => sel3.at >= r.s && sel3.at <= r.e);
  return run ? { f, w, run, room: rooms[run.room] } : null;
}
function showProps3() {
  const face = pickedFace();
  const df = sel3 && sel3.kind === 'door' && P.floors[sel3.floor], door = df && df.openings.find(o => o.id === sel3.id);
  if (!face && !door && sel3) { sel3 = null; dirty3d = true; }
  const was = props3.style.display === 'block', open = !!(face || door);
  props3.style.display = open ? 'block' : 'none';
  if (was !== open) resize();
  if (door) {
    props3.innerHTML = `<h4>Door · ${esc(df.name)}</h4>
      <div class="row" style="margin-top:0">Size<b>${door.width.toFixed(2)} × ${door.height.toFixed(2)} m</b></div>` + doorControls(sel3.floor, door);
    return bindDoorControls(props3, door, showProps3);
  }
  if (!face) return;
  const { f, w, run, room } = face, out = run.room < 0;
  const color = paintOf(w, sel3.side, run)?.color || (out ? CLAD_COLOR : WALL_COLOR);
  props3.innerHTML = `<h4>Wall · ${esc(f.name)}</h4>
    <div class="row" style="margin-top:0">${out ? 'Outside face' : 'Inside face'}<b>${out ? 'Cladding' : esc(room.name || 'Unnamed room')}</b></div>
    <div class="row">Length<b>${(run.e - run.s).toFixed(2)} m</b></div>
    <div class="sub">Color</div>
    ${colorPicker(WALL_SWATCHES, color)}
    <button class="del">Reset to default color</button>`;
  let dirty = false;                                   // one undo step per run of color dragging
  const paint = (c, rerender) => {
    if (!dirty) { commit(); dirty = true; }
    w.paint = (w.paint || []).filter(p => !(p.side === sel3.side && p.at >= run.s && p.at <= run.e));
    if (c) w.paint.push({ side: sel3.side, at: sel3.at, color: c });
    if (!w.paint.length) delete w.paint;
    changed(); if (rerender) showProps3();
  };
  const custom = props3.querySelector('input[type=color]');
  custom.oninput = () => paint(custom.value); custom.onchange = () => showProps3();
  props3.querySelectorAll('[data-color]').forEach(b => b.onclick = () => paint(b.dataset.color, true));
  bindSaved(props3);
  props3.querySelector('.del').onclick = () => paint(null, true);
}
function updateSun() {
  const b = bounds(), d = b.size * 0.9 + 4;
  sun.position.set(b.cx + d * 0.6, d * 1.4, b.cy + d * 0.45); sun.target.position.set(b.cx, 0, b.cy);
  Object.assign(sun.shadow.camera, { left: -d, right: d, top: d, bottom: -d, near: 0.5, far: d * 4 });
  sun.shadow.camera.updateProjectionMatrix();
}
(function loop() {
  requestAnimationFrame(loop);
  if (!c3.clientWidth) return;
  if (dirty3d) build3D();
  controls.update(); renderer.render(scene, camera);
})();

/* ------------------------------------------------------------------ glue */
function changed(live) {
  allRooms = P.floors.map(deriveRooms); rooms = allRooms[P.active]; dirty3d = true;
  if (!live) { save(); renderFloors(); renderLists(); }
  const total = rooms.reduce((s, r) => s + r.area, 0);
  const outdoor = areas().reduce((s, a) => s + polyArea(a.pts), 0);
  document.getElementById('total').innerHTML = [
    rooms.length ? `${rooms.length} room${rooms.length > 1 ? 's' : ''} · <b>${total.toFixed(1)} m²</b>` : '',
    outdoor ? `outdoor <b>${outdoor.toFixed(1)} m²</b>` : ''].filter(Boolean).join(' · ');
  document.getElementById('undo').disabled = !undoStack.length;
  document.getElementById('redo').disabled = !redoStack.length;
  draw();
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cw = cv.clientWidth; ch = cv.clientHeight;
  if (cw) { cv.width = cw * dpr; cv.height = ch * dpr; draw(); }
  const w = c3.clientWidth, h = c3.clientHeight;
  if (w) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
}
new ResizeObserver(resize).observe(document.querySelector('main'));
function setView(v) {
  document.body.className = v;
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  resize();
}
/* ---------------------------------------------------------------- floors */
function setFloor(i) {
  P.active = i; S = P.floors[i]; sel = null; chain = null; poly = null;
  changed(); showProps(); syncInputs();
}
function renderFloors() {
  const el = document.getElementById('floors');
  el.innerHTML = P.floors.map((f, i) => `<button data-floor="${i}" class="${i === P.active ? 'on' : ''}">Floor ${i + 1}</button>`).join('')
    + `<button id="addFloor" title="Add a floor above this one, starting from a copy of its walls">+</button>`
    + `<button id="delFloor" title="Delete this floor" ${P.floors.length < 2 ? 'disabled' : ''}>−</button>`;
  el.querySelectorAll('[data-floor]').forEach(b => b.onclick = () => setFloor(+b.dataset.floor));
  el.querySelector('#addFloor').onclick = () => {
    commit();
    P.floors.splice(P.active + 1, 0, { name: '', height: S.height, thickness: S.thickness, openings: [], areas: [], rooms: [],
      walls: S.walls.map(w => ({ id: nid(), a: { ...w.a }, b: { ...w.b } })) });
    setFloor(P.active + 1);
  };
  el.querySelector('#delFloor').onclick = () => {
    if (P.floors.length < 2 || !confirm(`Delete floor ${P.active + 1} and everything on it?`)) return;
    commit(); P.floors.splice(P.active, 1); setFloor(Math.min(P.active, P.floors.length - 1));
  };
}
function syncInputs() { height.value = S.height; thickness.value = S.thickness; }
const height = document.getElementById('height'), thickness = document.getElementById('thickness');
for (const [el, f, lo, hi] of [[height, 'height', 2, 5], [thickness, 'thickness', 0.05, 0.6]])
  el.onchange = () => { const v = parseFloat(el.value); if (v > 0) { commit(); S[f] = clamp(v, lo, hi); normalize(); changed(); showProps(); } syncInputs(); };

document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
document.querySelectorAll('#views button').forEach(b => b.onclick = () => setView(b.dataset.view));
document.getElementById('undo').onclick = () => restore(undoStack, redoStack);
document.getElementById('redo').onclick = () => restore(redoStack, undoStack);
document.getElementById('fit').onclick = fit3D;
document.getElementById('allFloors').onclick = e => {
  showAll = !showAll; dirty3d = true; e.target.textContent = showAll ? 'Showing all floors' : 'Showing up to this floor';
};
document.getElementById('clear').onclick = () => { commit(); S.walls = []; S.openings = []; S.areas = []; S.rooms = []; S.stairs = []; sel = null; changed(); showProps(); setTool('wall'); };
document.getElementById('export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(P, null, 2)], { type: 'application/json' }));
  a.download = 'floor-plan.json'; a.click(); URL.revokeObjectURL(a.href);
};
const file = document.getElementById('file');
document.getElementById('import').onclick = () => file.click();
file.onchange = async () => {
  try {
    const s = migrate(JSON.parse(await file.files[0].text()));
    if (!valid(s)) throw 0;
    commit(); setP(s); sel = null; normalize(); changed(); showProps(); syncInputs(); fit3D();
  } catch { alert('That file is not a Home Planner floor plan.'); }
  file.value = '';
};

function fit2D() {
  if (!cw || !S.walls.length) return;
  const b = bounds();
  view.s = clamp(Math.min(cw * 0.8 / Math.max(b.w, 1), ch * 0.8 / Math.max(b.h, 1)), 8, 120);
  view.ox = cw / 2 - b.cx * view.s; view.oy = ch / 2 - b.cy * view.s; draw();
}
syncInputs(); setView('split'); setTool('select'); changed(); fit3D(); fit2D();
</script>
